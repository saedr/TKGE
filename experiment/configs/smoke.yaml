experiment_name: distmult_smoke
seed: 11
dataset:
  root: data/FB15k-237
  train: train.txt
  valid: valid.txt
  test: test.txt
model:
  name: DistMult
  embedding_dim: 64
training:
  epochs: 8
  batch_size: 512
  lr: 0.01
  negatives_per_positive: 5
  checkpoint_name: checkpoint.pt
evaluation:
  max_test_queries: 400
  topk: 10
perturbation:
  budget: 0.30
  smoothing_c: 5
  conditions: [Original, Random, Structured-low, Structured-high]
runtime:
  device: cpu
