name: Confirmatory structured missingness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        dataset: [WN18RR, CoDEx-M]
        model: [TransE, DistMult, ComplEx, RotatE]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r experiment/requirements.txt
      - name: Download dataset
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dataset }}" = "WN18RR" ]; then
            mkdir -p data/WN18RR
            for s in train valid test; do
              curl -L --retry 3 -o data/WN18RR/${s}.txt https://raw.githubusercontent.com/kkteru/grail/master/data/WN18RR/${s}.txt
            done
          else
            mkdir -p data/CoDEx-M
            for s in train valid test; do
              curl -L --retry 3 -o data/CoDEx-M/${s}.txt https://raw.githubusercontent.com/tsafavi/codex/master/data/triples/codex-m/${s}.txt
            done
          fi
          wc -l data/${{ matrix.dataset }}/*.txt
      - name: Run confirmatory chunk
        env:
          PYTHONPATH: .
        run: |
          mkdir -p confirmatory_raw
          python -u -m experiment.scripts.run_confirmatory_chunk \
            --dataset '${{ matrix.dataset }}' \
            --model '${{ matrix.model }}' \
            --out 'confirmatory_raw/${{ matrix.dataset }}_${{ matrix.model }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.dataset }}-${{ matrix.model }}
          path: confirmatory_raw/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: confirmatory_downloads
          merge-multiple: true
      - name: Aggregate
        env:
          PYTHONPATH: .
        run: |
          python -m experiment.scripts.aggregate_confirmatory \
            --indir confirmatory_downloads \
            --out confirmatory_analysis/confirmatory_summary.json \
            --report confirmatory_analysis/confirmatory_report.md \
            --tables-dir confirmatory_analysis/tables
          cat confirmatory_analysis/confirmatory_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: confirmatory-summary
          path: confirmatory_analysis/
          retention-days: 90
