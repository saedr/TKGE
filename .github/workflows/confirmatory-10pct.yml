name: Confirmatory 10 percent structured missingness

on:
  pull_request:
    branches: [confirmatory-10pct-base]

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        dataset: [WN18RR, CoDEx-M]
        model: [TransE, DistMult, ComplEx]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r experiment/requirements.txt
      - name: Download dataset
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dataset }}" = "WN18RR" ]; then
            mkdir -p data/WN18RR
            for s in train valid test; do
              curl -L --retry 3 -o data/WN18RR/${s}.txt https://raw.githubusercontent.com/kkteru/grail/master/data/WN18RR/${s}.txt
            done
          else
            mkdir -p data/CoDEx-M
            for s in train valid test; do
              curl -L --retry 3 -o data/CoDEx-M/${s}.txt https://raw.githubusercontent.com/tsafavi/codex/master/data/triples/codex-m/${s}.txt
            done
          fi
      - name: Run 10 percent chunk
        env:
          PYTHONPATH: .
        run: |
          mkdir -p confirmatory_10pct_raw
          python -u -m experiment.scripts.run_confirmatory_10pct \
            --dataset '${{ matrix.dataset }}' \
            --model '${{ matrix.model }}' \
            --out 'confirmatory_10pct_raw/${{ matrix.dataset }}_${{ matrix.model }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result10-${{ matrix.dataset }}-${{ matrix.model }}
          path: confirmatory_10pct_raw/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: result10-*
          path: confirmatory_10pct_downloads
          merge-multiple: true
      - name: Aggregate 10 percent replication
        env:
          PYTHONPATH: .
        run: |
          python -m experiment.scripts.aggregate_confirmatory_10pct \
            --indir confirmatory_10pct_downloads \
            --out confirmatory_10pct_analysis/summary.json \
            --report confirmatory_10pct_analysis/report.md \
            --tables-dir confirmatory_10pct_analysis/tables
          cat confirmatory_10pct_analysis/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: confirmatory-10pct-summary
          path: confirmatory_10pct_analysis/
          retention-days: 90
