name: identified-ranking-falsification

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiment/identified_ranking/**'
      - '.github/workflows/identified_ranking_falsification.yml'
  workflow_dispatch:

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r experiment/requirements.txt

      - name: Run frozen falsification
        run: |
          python -u experiment/identified_ranking/run_falsification.py

      - name: Print frozen decision
        if: always()
        run: |
          if [ -f experiment/identified_ranking/results/RESULT.json ]; then
            cat experiment/identified_ranking/results/RESULT.json
          else
            echo 'No scientific RESULT.json produced.'
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identified-ranking-results
          path: experiment/identified_ranking/results/
          if-no-files-found: warn
          retention-days: 30
