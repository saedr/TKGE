name: GraphGuard TempBench phenomenon pilot

on:
  pull_request:
    branches: [graphguard-exp-base]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.5.1 transformers==4.53.3 huggingface_hub==0.28.1 scikit-learn==1.5.2 numpy==1.26.4
      - name: Run frozen phenomenon gate
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python -u experiment/scripts/graphguard_tempbench_pilot.py \
            --outdir experiment/results/graphguard_tempbench_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphguard-tempbench-pilot
          path: experiment/results/graphguard_tempbench_pilot/
          if-no-files-found: warn
          retention-days: 90
